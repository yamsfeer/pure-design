<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>你好</title>
  <style>
    /* ─── tokens — bind to active DESIGN.md and stop ───────────────── */
    :root {
      --bg:      #fafafa;   /* 近白底 — never #fff */
      --surface: #ffffff;
      --fg:      #111111;   /* 近黑字 — never #000 */
      --muted:   #6b6b6b;
      --border:  #e5e5e5;
      --accent:  #2f6feb;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);

      /* type — display = serif；中文 glyph 由系统衬线/苹方回退提供 */
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Songti SC', 'SimSun', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --gutter: 24px;
    }

    /* ─── reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    p, h1 { margin: 0; }

    /* ─── 全屏居中问候 ─────────────────────────────────────────────── */
    .greeting {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--gutter);
      text-align: center;
    }
    .hello {
      font-family: var(--font-display);
      font-size: clamp(64px, 16vw, 168px);
      font-weight: 600;
      line-height: 1.3;        /* CJK display text — 不能用 1.04 */
      letter-spacing: 0;       /* CJK — 不能用负字距 */
      text-wrap: balance;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hello { animation: none; }
    }
  </style>
</head>
<body>
  <main id="content">
    <section class="greeting" data-od-id="greeting">
      <h1 class="hello">你好</h1>
    </section>
  </main>
</body>
</html>
