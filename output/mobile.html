<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账本总览 · 极简记账</title>
  <style>
    /* ─── 设计系统 token（来自 minimal） ─── */
    :root {
      --bg:      #F4F4F1;   /* surface */
      --surface: #FFFFFF;
      --fg:      #0C0C09;   /* text / primary */
      --muted:   #6B6964;
      --border:  #E8E5DF;
      --accent:  #0C0C09;   /* primary — 极简品牌色, 用于强调 */

      --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Open Sans', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-body:    'Open Sans', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono:    'Inconsolata', ui-monospace, 'SF Mono', 'Cascadia Code', monospace;

      /* 移动端字号（比桌面端小一档） */
      --fs-h1: 26px;
      --fs-h2: 20px;
      --fs-h3: 16px;
      --fs-body: 15px;
      --fs-meta: 12px;

      --radius-card: 18px;
      --radius-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 5%, var(--bg)) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    /* ─── 设备上方说明 ─── */
    .stage { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }

    /* ─── 设备外框（iPhone 15 Pro 390×844） ─── */
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px; bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px; left: 50%;
      transform: translateX(-50%);
      width: 124px; height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    /* ─── 屏幕表面 ─── */
    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 状态栏 */
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }

    /* 内容区 — 可滚动，框架不动 */
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0 28px;
    }
    .content::-webkit-scrollbar { display: none; }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }

    /* ─── 屏幕原语 ─── */
    .pad     { padding-inline: 20px; }
    .stack   { display: flex; flex-direction: column; gap: 16px; }
    .row     { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grid-2  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .header {
      padding: 8px 20px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
      font-weight: 600;
    }
    .header .icon-btn {
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .header .icon-btn:hover { background: var(--fg-soft); }
    .header .icon-btn:active { transform: scale(0.94); }
    .header .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

    .greeting {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .h2  { font-family: var(--font-display); font-size: var(--fs-h2); letter-spacing: -0.015em; line-height: 1.2; margin: 0; font-weight: 600; }
    .h3  { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); letter-spacing: 0.02em; }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
    }
    .card.accent {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .card.accent .meta { color: rgba(255,255,255,0.65); }
    .card.flat { background: transparent; border: 0; padding: 12px 0; border-top: 1px solid var(--border); border-radius: 0; }
    .card.flat:first-child { border-top: 0; padding-top: 0; }

    .list-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .list-row:first-child { border-top: 0; }
    .list-row .category-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: grid; place-items: center;
      background: var(--fg-soft);
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .list-row .category-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .list-row .body .title { font-size: 15px; font-weight: 500; line-height: 1.25; }
    .list-row .body .sub   { color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 2px; }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 0;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab.active svg { stroke-width: 2; }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }

    /* 预算进度条 */
    .progress {
      height: 8px;
      background: var(--fg-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    /* 示例数据标记 */
    .sample-note {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: var(--fg-soft);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>极简记账</strong> · 账户总览</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">
        <!-- 状态栏 -->
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <!-- 可滚动内容 -->
        <main class="content" data-od-id="content">
          <!-- 头部 -->
          <div class="header" data-od-id="header">
            <div>
              <p class="greeting">四月 22 · 周二</p>
              <h1>账户总览</h1>
            </div>
            <button class="icon-btn" aria-label="设置">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
          </div>

          <!-- 本月支出总览 -->
          <section class="pad" data-od-id="spend-overview" style="margin-bottom: 16px;">
            <div class="card" style="padding: 20px;">
              <div class="row-between" style="margin-bottom: 12px;">
                <div>
                  <p class="meta" style="margin: 0 0 4px;">本月支出 · 四月</p>
                  <div class="num" style="font-size: 32px; letter-spacing: -0.02em; font-weight: 600;">¥8,746.50</div>
                </div>
                <span class="sample-note">示例</span>
              </div>
              <div class="row-between" style="margin-bottom: 6px;">
                <span style="font-size: 13px; color: var(--muted);">预算 ¥10,000</span>
                <span class="num" style="font-size: 13px; font-weight: 500;">87%</span>
              </div>
              <!-- 进度条 -->
              <div class="progress" role="progressbar" aria-valuenow="87" aria-valuemin="0" aria-valuemax="100" aria-label="预算使用 87%">
                <span style="width: 87%;"></span>
              </div>
              <p class="meta" style="margin: 8px 0 0;">剩余 ¥1,253.50</p>
            </div>
          </section>

          <!-- 最近交易 -->
          <section class="pad" data-od-id="recent-transactions">
            <div class="row-between" style="margin: 0 0 8px;">
              <h2 class="h2" style="font-size: 18px;">最近交易</h2>
              <button style="background: none; border: 0; padding: 4px; color: var(--muted); font-size: 13px; cursor: pointer; font-weight: 500;">查看全部 →</button>
            </div>

            <div class="card" style="padding: 4px 16px;">
              <!-- 交易 1 -->
              <div class="list-row">
                <div class="category-icon">
                  <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="body">
                  <div class="title">每日咖啡 · Manner</div>
                  <div class="sub">餐饮 · 今天 09:14</div>
                </div>
                <span class="num" style="font-weight: 600;">−¥32.00</span>
              </div>
              <!-- 交易 2 -->
              <div class="list-row">
                <div class="category-icon">
                  <svg viewBox="0 0 24 24"><path d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="M3 7h18"/></svg>
                </div>
                <div class="body">
                  <div class="title">地铁通勤</div>
                  <div class="sub">交通 · 昨天 08:55</div>
                </div>
                <span class="num" style="font-weight: 600;">−¥6.00</span>
              </div>
              <!-- 交易 3 -->
              <div class="list-row">
                <div class="category-icon">
                  <svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/><path d="M12 7v10"/></svg>
                </div>
                <div class="body">
                  <div class="title">盒马·鲜生 采购</div>
                  <div class="sub">购物 · 4月20日</div>
                </div>
                <span class="num" style="font-weight: 600;">−¥268.30</span>
              </div>
              <!-- 交易 4 -->
              <div class="list-row">
                <div class="category-icon">
                  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                </div>
                <div class="body">
                  <div class="title">Netflix 订阅</div>
                  <div class="sub">娱乐 · 4月18日</div>
                </div>
                <span class="num" style="font-weight: 600;">−¥68.00</span>
              </div>
            </div>
          </section>

          <!-- 快捷添加按钮（示意） -->
          <section class="pad" data-od-id="quick-add" style="margin-top: 20px;">
            <button class="btn-primary">记一笔</button>
          </section>
        </main>

        <!-- 标签栏 -->
        <nav class="tabbar" style="--tabs: 4;" data-od-id="tabbar">
          <a class="tab active" aria-current="page">
            <svg viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
            总览
          </a>
          <a class="tab">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            明细
          </a>
          <a class="tab">
            <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7h-5a3 3 0 0 0-3 3 3 3 0 0 0 3 3h4a3 3 0 0 1 3 3 3 3 0 0 1-3 3H8"/></svg>
            预算
          </a>
          <a class="tab">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
            我的
          </a>
        </nav>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
